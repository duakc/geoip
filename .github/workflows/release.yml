name: Release
on:
  push:
    branches:
      - gen
    paths-ignore:
      - README.md
      - .gitignore
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        name: "Check out"
      - uses: actions/setup-go@v6
        name: "Setup Go"
        with:
          go-version: 1.26.2
          cache: true
      - name: Cache go module
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
          key: go-${{ hashFiles('**/go.sum') }}
      - name: "Generate"
        env:
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
        run: |
          make fetch
          make generate
      - name: "Upload"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          mkdir -p generated/ip && cd generated/ip
          cp ../../data/ip/* .

          rm -rf .git
          git init -b release
          git add -A
          git commit -m "Release $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" release